<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e2b63">
<title>Judô Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Tatame verde no fundo, judogi branco e azul por cima. A trama do judogi fica só onde não
     há texto corrido (cabeçalho, gola das respostas, caixa do filtro). */
  :root {
    --mat: #2d6e4a; --seam: #245c3d; --blue: #1e2b63; --stitch: #a3aedb; --white: #ffffff;
    --ink: #16231c; --muted: #4f5a66; --line: #e3e6ee; --hinomaru: #d23b33;
    --weave-blue: repeating-linear-gradient(-45deg, rgba(255,255,255,.07) 0 1px, transparent 1px 4px);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 400 17px/1.55 "Atkinson Hyperlegible", system-ui, sans-serif;
         background-color: var(--mat);
         /* placas de 1 x 2 m */
         background-image: linear-gradient(var(--seam) 2px, transparent 2px), linear-gradient(90deg, var(--seam) 2px, transparent 2px);
         background-size: 96px 192px; overflow: hidden; }
  /* Cabeçalho e dock fixos nas pontas e só a conversa rola. Com o teclado aberto no celular,
     a altura acompanha a área visível (interactive-widget e o script no fim); antes a página
     rolava e o cabeçalho sumia, com o tatame aparecendo entre o campo e o teclado. */
  main { max-width: 640px; margin: 0 auto; height: var(--app-height, 100dvh); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

  header { display: flex; align-items: baseline; justify-content: space-between;
           padding: calc(18px + env(safe-area-inset-top)) 16px 12px; background: var(--weave-blue) var(--blue); color: #eef1f8; }
  h1 { margin: 0; font: 800 1.35rem "Shippori Mincho B1", serif; }
  header span { font: 600 1rem "Shippori Mincho B1", serif; color: var(--stitch); }

  #log { display: flex; flex-direction: column; gap: 12px; padding: 20px 12px; overflow-y: auto; overscroll-behavior: contain; }
  /* Mesma folha das respostas: texto direto no tatame fica difícil de ler. */
  .intro { margin: 0; padding: 26px 16px 16px; border-radius: 8px; color: var(--ink);
       background: var(--weave-blue) top / 100% 10px no-repeat, linear-gradient(var(--blue), var(--blue)) top / 100% 10px no-repeat, var(--white); }
  .msg { overflow-wrap: anywhere; scroll-margin: 12px 0; }
  .msg.user { align-self: flex-end; max-width: 85%; padding: 10px 16px; border-radius: 18px 18px 4px 18px;
              background: var(--blue); color: var(--white); font-weight: 700; white-space: pre-wrap; }

  /* Resposta: folha branca lisa com a gola de judogi azul no alto. */
  .msg.bot { padding: 26px 16px 16px; border-radius: 8px;
       background: var(--weave-blue) top / 100% 10px no-repeat, linear-gradient(var(--blue), var(--blue)) top / 100% 10px no-repeat, var(--white); }
  .msg.bot.has-kanji { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 14px; padding-left: 12px; }
  .kanji { align-self: start; justify-self: start; writing-mode: vertical-rl; text-orientation: upright;
       font: 800 2.2rem/1 "Shippori Mincho B1", serif; letter-spacing: .08em; color: var(--blue);
       padding-right: 10px; border-right: 2px solid #d5dbef; }
  .msg.bot p, .msg.bot ul, .msg.bot ol { margin: 0 0 10px; }
  .msg.bot h3 { margin: 4px 0 8px; font: 800 1.4rem/1.2 "Shippori Mincho B1", serif; color: var(--blue); }
  .msg.bot > .body > h3:first-child { margin-top: 0; font-size: 1.65rem; }
  .msg.bot ul { padding-left: 22px; }
  .msg.bot ol { list-style: none; padding: 0; counter-reset: s; }
  .msg.bot ol > li { counter-increment: s; position: relative; padding: 10px 0 10px 42px; }
  .msg.bot ol > li + li { border-top: 1px solid var(--line); }
  .msg.bot ol > li::before { content: counter(s); position: absolute; left: 0; top: 8px; width: 32px; height: 32px;
       border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--blue); background: var(--white);
       color: var(--blue); font: 800 1rem "Shippori Mincho B1", serif; }
  .msg.bot strong { color: var(--blue); }
  .msg.bot hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .msg.bot a { color: var(--blue); }

  .video-inline, .videos { display: grid; gap: 6px; margin: 8px 0 12px; }
  .videos strong { font: 800 1.05rem "Shippori Mincho B1", serif; }
  .msg.bot a.video { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border-radius: 8px;
       border: 2px solid var(--blue); color: var(--blue); text-decoration: none; font-weight: 700; line-height: 1.3; }
  .msg.bot a.video.kodokan { background: var(--blue); color: var(--white); }
  .video svg { flex: 0 0 auto; }
  .tags { grid-column: 1 / -1; margin-top: 4px; font-size: .82rem; color: var(--muted); }

  /* Recusa e erro: o "matte" do árbitro, com o círculo vermelho. */
  .msg.refused { display: flex; gap: 14px; align-items: center; padding: 24px 16px 14px; border-radius: 8px;
       background: var(--weave-blue) top / 100% 10px no-repeat, linear-gradient(var(--blue), var(--blue)) top / 100% 10px no-repeat, var(--white); }
  .mark { flex: 0 0 36px; height: 36px; border-radius: 50%; background: var(--hinomaru); }
  .msg.refused strong { display: block; font: 800 1.25rem "Shippori Mincho B1", serif; color: var(--blue); }
  .msg.refused p { margin: 0; color: var(--muted); font-size: .95rem; }

  /* Faixa azul como a do cabeçalho, até a borda de baixo: o tatame não aparece sob o campo. */
  .dock { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--weave-blue) var(--blue); }
  .topics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; padding: 4px;
       border-radius: 14px; border: 1px solid rgba(163,174,219,.35); background: rgba(255,255,255,.06); }
  .topics button { min-height: 60px; padding: 6px 0 8px; border: 0; border-radius: 10px; background: transparent;
       color: #c3cae6; font: 700 .9rem "Atkinson Hyperlegible", sans-serif; cursor: pointer;
       display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .topics i { font: 800 1.45rem/1 "Shippori Mincho B1", serif; font-style: normal; }
  .topics button[aria-pressed="true"] { background: var(--white); color: var(--blue); }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; min-height: 52px; max-height: 140px; resize: none; padding: 14px 16px; border: 0;
       border-radius: 26px; background: var(--white); color: var(--ink); font: inherit; font-size: 1rem; }
  textarea::placeholder { color: #6b7590; }
  form button { flex: 0 0 52px; height: 52px; padding: 0; border: 2px solid var(--blue); border-radius: 50%;
       background: var(--white); color: var(--blue); cursor: pointer; display: grid; place-items: center; }
  form button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .msg :focus-visible { outline-color: var(--blue); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Judô Chat</h1>
    <span lang="ja">柔道</span>
  </header>
  <section id="log" aria-live="polite">
    <p class="intro">Kuzushi, tsukuri e kake de cada técnica, com o vídeo oficial do Kodokan quando existe.</p>
  </section>
  <div class="dock">
    <nav class="topics" role="group" aria-label="Assunto">
      <button type="button" aria-pressed="true" data-example="Ex.: como entro no uchi-mata?" data-intro="Kuzushi, tsukuri e kake de cada técnica, com o vídeo oficial do Kodokan quando existe."><i lang="ja" aria-hidden="true">技</i>Técnicas</button>
      <button type="button" aria-pressed="false" data-example="Ex.: o que dá shido?" data-intro="Pontuação, shido e hansoku-make, e o que cai no seu próximo exame de faixa."><i lang="ja" aria-hidden="true">規</i>Regras</button>
      <button type="button" aria-pressed="false" data-example="Ex.: quem foi Jigoro Kano?" data-intro="De Jigoro Kano e do Kodokan à chegada do judô ao Brasil."><i lang="ja" aria-hidden="true">歴</i>História</button>
    </nav>
    <form id="form">
      <label for="query" class="sr">Sua pergunta</label>
      <textarea id="query" rows="1" maxlength="1000" placeholder="Ex.: como entro no uchi-mata?" required></textarea>
      <button id="send" type="submit" aria-label="Perguntar">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>
</main>
<script src="config.js"></script>
<script>
  // Vazio quando a página é servida pela própria API; no GitHub Pages, a URL pública da API.
  const API_URL = (window.JUDO_CHAT_API_URL || "").replace(/\/$/, "");
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("query");
  const button = document.getElementById("send");

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Markdown mínimo (títulos, negrito, itálico, listas, links, separador). O texto é
  // escapado antes, então só as marcações abaixo viram HTML.
  function inline(text) {
    return text
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }

  function renderMarkdown(text) {
    const lines = escapeHtml(text).split("\n");
    const html = [];
    let list = null;
    const closeList = () => { if (list) { html.push(`</${list}>`); list = null; } };
    for (const raw of lines) {
      const line = raw.trim();
      let m;
      if (!line) { closeList(); continue; }
      if (/^-{3,}$/.test(line)) { closeList(); html.push("<hr>"); continue; }
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) { closeList(); html.push(`<h3>${inline(m[1])}</h3>`); continue; }
      if ((m = line.match(/^[-*]\s+(.*)$/))) {
        if (list !== "ul") { closeList(); html.push("<ul>"); list = "ul"; }
        html.push(`<li>${inline(m[1])}</li>`); continue;
      }
      if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
        if (list !== "ol") { closeList(); html.push("<ol>"); list = "ol"; }
        html.push(`<li>${inline(m[1])}</li>`); continue;
      }
      closeList();
      html.push(`<p>${inline(line)}</p>`);
    }
    closeList();
    return html.join("");
  }

  const PLAY = '<svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3.5v11l9-5.5z" fill="currentColor"/></svg>';

  function videoLink(video, label) {
    const a = document.createElement("a");
    a.href = video.url; a.target = "_blank"; a.rel = "noopener";
    a.className = "video" + (video.kodokan ? " kodokan" : "");
    a.innerHTML = PLAY;
    a.appendChild(document.createTextNode(label + (video.kodokan ? ": vídeo oficial do Kodokan" : ": vídeo de outra fonte")));
    return a;
  }

  // Põe os vídeos de cada técnica logo abaixo do título ou item onde ela é apresentada; os
  // grupos sem lugar na resposta vão para o bloco "Vídeos" no fim.
  function placeVideos(body, groups) {
    const leftovers = [];
    const candidates = Array.from(body.querySelectorAll("h3, li, p"));
    for (const group of groups || []) {
      const anchor = group.anchor && group.anchor.toLowerCase();
      const target = anchor && candidates.find((el) => el.textContent.toLowerCase().includes(anchor));
      if (!target) { leftovers.push(group); continue; }
      const box = document.createElement("div");
      box.className = "video-inline";
      for (const video of group.videos) box.appendChild(videoLink(video, group.technique));
      if (target.tagName === "LI") target.appendChild(box); else target.after(box);
    }
    if (!leftovers.length) return;
    const box = document.createElement("div");
    box.className = "videos";
    const title = document.createElement("strong");
    title.textContent = "Vídeos";
    box.appendChild(title);
    for (const group of leftovers) {
      for (const video of group.videos) box.appendChild(videoLink(video, group.technique));
    }
    body.appendChild(box);
  }

  function addUser(text) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    log.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  // O kanji vai na coluna ao lado só quando a resposta apresenta uma técnica: com várias,
  // a coluna não diria de qual delas é.
  function addAnswer(text, tags, groups) {
    const div = document.createElement("article");
    div.className = "msg bot";
    const anchored = (groups || []).filter((g) => g.anchor);
    if (anchored.length === 1 && anchored[0].kanji) {
      const kanji = document.createElement("div");
      kanji.className = "kanji"; kanji.lang = "ja"; kanji.setAttribute("aria-hidden", "true");
      kanji.textContent = anchored[0].kanji;
      div.classList.add("has-kanji");
      div.appendChild(kanji);
    }
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = renderMarkdown(text);
    placeVideos(body, groups);
    div.appendChild(body);
    if (tags) {
      const small = document.createElement("div");
      small.className = "tags";
      small.textContent = tags;
      div.appendChild(small);
    }
    log.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function addStop(title, text) {
    const div = document.createElement("div");
    div.className = "msg refused";
    div.setAttribute("role", "note");
    div.innerHTML = '<span class="mark" aria-hidden="true"></span><div><strong></strong><p></p></div>';
    div.querySelector("strong").textContent = title;
    div.querySelector("p").textContent = text;
    log.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  // O filtro só troca o exemplo do campo e o texto de boas-vindas; a API não recebe o assunto.
  document.querySelectorAll(".topics button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".topics button").forEach((o) => o.setAttribute("aria-pressed", o === b));
    input.placeholder = b.dataset.example;
    const intro = log.querySelector(".intro");
    if (intro) intro.textContent = b.dataset.intro;
    input.focus();
  }));

  // Últimas trocas da conversa, enviadas a cada pergunta (o servidor não guarda estado).
  const MAX_TURNS = 6;
  const MAX_TURN_CHARS = 1500;
  let history = [];

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    const intro = log.querySelector(".intro");
    if (intro) intro.remove();
    addUser(query);
    input.value = "";
    button.disabled = true;
    try {
      const response = await fetch(API_URL + "/api/perguntar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, history }),
      });
      const data = await response.json();
      if (!response.ok) {
        addStop("Sem resposta", data.detail || "Erro ao responder.");
        return;
      }
      if (data.refused) {
        addStop("Matte", data.answer);
        return;
      }
      const found = data.techniques_detected.map((t) => t.term + (t.ambiguous ? " (ambíguo)" : ""));
      const tags = found.length ? "Técnicas reconhecidas: " + found.join(", ") : "";
      addAnswer(data.answer, tags, data.video_groups);
      history = history.concat([
        { role: "usuario", text: query },
        { role: "assistente", text: data.answer.slice(0, MAX_TURN_CHARS) },
      ]).slice(-MAX_TURNS);
    } catch (error) {
      addStop("Sem resposta", "Não foi possível falar com o servidor. Ele pode estar desligado.");
    } finally {
      button.disabled = false;
      input.focus();
    }
  });

  // Navegadores que ignoram interactive-widget (Safari, por exemplo) encolhem só a área
  // visível quando o teclado abre: a página segue essa altura e volta ao topo.
  if (window.visualViewport) {
    const fitViewport = () => {
      // Com zoom de pinça, a área visível é um recorte da página; não mexe na altura.
      if (window.visualViewport.scale > 1.01) return;
      document.documentElement.style.setProperty("--app-height", window.visualViewport.height + "px");
      window.scrollTo(0, 0);
    };
    window.visualViewport.addEventListener("resize", fitViewport);
    window.visualViewport.addEventListener("scroll", fitViewport);
    fitViewport();
  }

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
