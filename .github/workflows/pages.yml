# Publica a página de chat (src/judo_chat/static) no GitHub Pages.
# A API não roda aqui: a página a chama pela URL da variável de repositório
# JUDO_CHAT_API_URL (Settings > Secrets and variables > Actions > Variables).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "src/judo_chat/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runner fixo: o ubuntu-latest passou a migrar para o Ubuntu 26 em 2026-10-19
  # (actions/runner-images#14748) e os jobs ainda não rodaram nele.
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Montar o site
        env:
          API_URL: ${{ vars.JUDO_CHAT_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Defina a variável de repositório JUDO_CHAT_API_URL." >&2; exit 1; fi
          mkdir -p _site
          cp src/judo_chat/static/* _site/
          printf 'window.JUDO_CHAT_API_URL = "%s";\n' "$API_URL" > _site/config.js
          cat _site/config.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
