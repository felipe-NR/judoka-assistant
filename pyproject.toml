[project]
name = "judo-chat"
version = "0.1.0"
description = "Assistente em pt-BR para técnicas, história e regras do judô"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
    "maxminddb>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judo_chat"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: chama a API do provedor configurado de verdade (custa dinheiro)"]
addopts = "-m 'not eval'"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Piso da cobertura de linhas e ramos no CI (deploy.yml). Com os testes do PR #32 ela ficou
# em 95%; o piso deixa margem para refatorações sem aceitar módulos novos sem teste.
fail_under = 93
show_missing = true
skip_covered = true
